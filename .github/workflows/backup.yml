# Weekly database backup.
#
# Why this exists: Supabase's free tier provides no automatic backups, so a bad
# migration or an accidental delete has nothing to fall back on. Free-tier
# projects also pause after seven days without database activity -- this job's
# weekly connection doubles as a keep-alive.
#
# Setup: add one repository secret, SUPABASE_DB_URL.
#
# It must use the backup_reader role created by
# supabase/migrations/20261008010000_backup_reader_role.sql, not postgres.
# backup_reader can only SELECT, so if this secret leaked the worst it allows is
# reading rows a signed-in member could already read. The postgres password can
# drop tables and is exempt from Row Level Security, so it must not live here.
#
# The string comes from the shared pooler in session mode. For a custom role the
# pooler username is [ROLE].[PROJECT-REF], not the bare role name:
#
#   postgresql://backup_reader.[PROJECT-REF]:[PASSWORD]@[POOLER-HOST]:5432/postgres
#
# Take the host from the dashboard's "Session pooler" tab rather than composing
# it -- the pooler host is not derivable from the region. Session mode is
# required: the direct connection is IPv6-only on the free tier, and
# GitHub-hosted runners have no IPv6 at all, so a direct string fails with an
# error that reads like a wrong password.
#
# Scope: the `public` schema, which is the app's data. Auth identities live in
# `auth`, which Supabase manages and which cannot be restored from a dump
# anyway -- if that were lost, users would sign in again and be re-approved.

name: Backup

on:
  schedule:
    # 02:00 UTC every Sunday. Scheduled runs can be delayed at busy times.
    - cron: "0 2 * * 0"
  # Manual button, so you can take a dump before a risky migration.
  workflow_dispatch:

jobs:
  dump:
    name: dump public schema
    runs-on: ubuntu-latest

    steps:
      - name: Check the secret is present
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # Ubuntu's default postgresql-client is 16, and the Supabase server is 17.
      # pg_dump refuses to dump a server newer than itself -- it exits with
      # "aborting because of server version mismatch" before reading a single
      # row -- so the client has to come from the PostgreSQL apt repo instead.
      #
      # Pinned to the server's major version on purpose. When Supabase upgrades
      # the project to 18 this breaks again, but it fails loudly and names both
      # versions, so the fix is just bumping the two 17s below.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -sSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Installing 17 does not change what `pg_dump` resolves to. The runner
          # already ships a 16 binary earlier on PATH and it wins, which is how
          # the previous run installed 17 correctly and still reported 16.15.
          # So call the 17 binary by its full path, and hand it to later steps.
          PGBIN=/usr/lib/postgresql/17/bin
          test -x "$PGBIN/pg_dump" || {
            echo "::error::pg_dump 17 not found at $PGBIN/pg_dump - the client did not install as expected."
            exit 1
          }
          "$PGBIN/pg_dump" --version
          "$PGBIN/pg_dump" --version | grep -q ' 17\.' || {
            echo "::error::$PGBIN/pg_dump is not version 17; it will refuse to dump the server."
            exit 1
          }
          echo "PG_DUMP=$PGBIN/pg_dump" >> "$GITHUB_ENV"

      - name: Dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup
          stamp=$(date -u +%Y-%m-%d)
          file="backup/tiffinsplit-${stamp}.sql"
          "$PG_DUMP" "$DB_URL" \
            --schema=public \
            --no-owner \
            --no-privileges \
            --format=plain \
            > "$file"
          gzip "$file"
          ls -la backup/

      # A dump that exits zero and contains no rows is the failure this whole
      # job exists to prevent: RLS applying to the backup role, a missing
      # grant, or a wrong password all produce a file that looks fine and
      # restores an empty database. So count the actual rows, per table, and
      # refuse to call it a success if there are none at all.
      - name: Verify the dump actually contains data
        run: |
          set -euo pipefail
          # awk always exits 0 here on purpose: a non-zero exit would trip
          # `set -e` and kill the step before the message below could explain
          # what went wrong. The decision is made in the shell instead.
          zcat backup/*.sql.gz | awk '
            /^COPY public\./ { tbl=$2; n=0; inblk=1; next }
            inblk && /^\\\.$/ { printf "  %-40s %d\n", tbl, n; total+=n; inblk=0; next }
            inblk { n++ }
            END { printf "  %-40s %d\n", "TOTAL", total+0 }
          ' | tee rowcounts.txt
          if [ "$(tail -1 rowcounts.txt | awk '{print $NF}')" -eq 0 ]; then
            echo "::error::The dump contains no rows. The backup user is probably not bypassing Row Level Security, or lacks SELECT. Check that the secret uses backup_reader and that 20261008010000_backup_reader_role.sql is applied."
            exit 1
          fi

      # A dump of this database contains the group's names and email addresses.
      # On a public repository, Actions artifacts are downloadable by anyone, so
      # uploading one would publish that. Rather than rely on that being
      # remembered, check the repository's actual visibility and refuse.
      - name: Refuse to publish a dump from a public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          vis=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | jq -r .visibility)
          echo "repository visibility: $vis"
          if [ "$vis" != "private" ]; then
            echo "::error::This repository is '$vis', so a backup artifact would be readable by anyone with the repo URL. Make it private (Settings -> General -> Danger Zone -> Change visibility), or store the dump somewhere access-controlled instead."
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tiffinsplit-backup-${{ github.run_id }}
          path: backup/
          # Free-tier artifact retention is 90 days -- a rolling window, not an
          # archive. Plenty for "we broke something last month".
          retention-days: 90
