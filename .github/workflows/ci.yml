# Runs on every pull request, and on every push to main.
#
# This is the gate the branch ruleset can require. It exists because three
# things have actually broken this project, and none of them were visible by
# reading a diff:
#
#   1. package-lock.json drifting out of sync with package.json
#      -> caught by `npm ci`, which refuses to install when they disagree.
#   2. A dependency version npm couldn't resolve
#      -> also caught at install time.
#   3. Type errors and build failures
#      -> caught by the typecheck and build steps.
#
# The build step matters most: it's the one check that cannot run in the
# development sandbox (WebAssembly memory limit), so until now the Vercel
# preview was the first real build every change got.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install, typecheck, lint, test, build
    runs-on: ubuntu-latest

    env:
      # The build only needs these to be *defined*, not valid — no request is
      # made at build time. Real values are used if the secrets exist, so
      # adding them later needs no change here.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs exactly what the lockfile says and fails if the
      # lockfile and package.json disagree.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
